name: linux-diagnostics

# Temporary: reproduce the Linux matrix steps and publish the raw output to a
# branch, so the failure can be read without the Actions API. Removed before the
# release is tagged.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    name: linux / diagnose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          mkdir -p diag
          echo '=== ctest (the matrix command) ===' > diag/ctest.log
          ctest --test-dir build --output-on-failure >> diag/ctest.log 2>&1
          echo "ctest exit code: $?" >> diag/ctest.log
          echo '=== the same suite in one process ===' > diag/direct.log
          build/tests/drc_tests >> diag/direct.log 2>&1
          echo "direct exit code: $?" >> diag/direct.log
          echo '=== benchmark quick ===' > diag/bench.log
          build/benchmarks/drc_benchmarks --quick >> diag/bench.log 2>&1
          echo "benchmark exit code: $?" >> diag/bench.log
          echo '=== per-area exit codes ===' > diag/areas.log
          for area in unit integration e2e property adversarial recovery multiprocess concurrency fencing cli; do
            build/tests/drc_tests --filter ${area}_ > /dev/null 2>&1
            echo "$area exit code: $?" >> diag/areas.log
          done
          echo '=== environment ===' > diag/env.log
          nproc >> diag/env.log
          uname -a >> diag/env.log
          ls -l build/tests/drc_tests build/benchmarks/drc_benchmarks >> diag/env.log

      - name: Publish diagnostics to a branch
        if: always()
        run: |
          git config user.email 'ci@invalid'
          git config user.name 'ci diagnostics'
          git checkout -b ci-diagnostics
          git add -f diag
          git commit -m 'linux diagnostics' || true
          git push -f origin ci-diagnostics
