name: linux-diagnose

# Temporary diagnostic entry point: one Linux job that prints the failing output
# in full instead of relying on the matrix to report it. Removed before release.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: linux / diagnose / ${{ inputs.build_type || 'Debug' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_install

      - name: Build
        run: cmake --build build

      - name: Test with full output
        run: |
          set +e
          build/tests/drc_tests > /tmp/tests.log 2>&1
          code=$?
          echo "test exit code: $code"
          echo '--- last 150 lines ---'
          tail -n 150 /tmp/tests.log
          echo '--- every FAIL line ---'
          grep -n 'FAIL' /tmp/tests.log | head -n 40
          exit 0

      - name: Install and downstream consumer
        run: |
          set +e
          bash scripts/verify_install.sh build _install Debug
          echo "install exit code: $?"
          exit 0
